<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖤 Chat Noir-MD | Pairing</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: url('https://files.catbox.moe/pnl7iq.jpg') center/cover no-repeat fixed;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    transition: background 0.4s ease;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 0;
    transition: background 0.4s ease;
  }

  body.light-mode::before {
    background: rgba(0,0,0,0.35);
  }

  .mode-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 5;
    background: rgba(10,10,10,0.85);
    border: 1px solid #2a2a2a;
    color: #39ff14;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(57,255,20,0.3);
    transition: 0.2s;
  }
  .mode-toggle:hover { box-shadow: 0 0 16px rgba(57,255,20,0.6); }

  .sound-toggle {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 5;
    background: rgba(10,10,10,0.85);
    border: 1px solid #2a2a2a;
    color: #39ff14;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(57,255,20,0.3);
    transition: 0.2s;
  }
  .sound-toggle:hover { box-shadow: 0 0 16px rgba(57,255,20,0.6); }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(6px);
    border: 1px solid #222;
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 0 30px rgba(57,255,20,0.1), 0 8px 24px rgba(0,0,0,0.6);
    text-align: center;
  }

  .cat-eyes {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 12px;
  }
  .cat-eye {
    width: 34px;
    height: 20px;
    background: #050505;
    border-radius: 50%;
    border: 1.5px solid #39ff14;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 0 8px rgba(57,255,20,0.6);
  }
  .cat-pupil {
    width: 8px;
    height: 12px;
    background: #39ff14;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(57,255,20,0.9);
    animation: lookAround 4s infinite ease-in-out;
  }
  @keyframes lookAround {
    0%, 10%   { transform: translateX(-6px); }
    45%, 55%  { transform: translateX(6px); }
    90%, 100% { transform: translateX(-6px); }
  }

  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #39ff14;
    box-shadow: 0 0 12px rgba(57,255,20,0.6);
    margin-bottom: 14px;
    animation: pulseGlow 1.8s infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 8px rgba(57,255,20,0.4); }
    50% { box-shadow: 0 0 20px rgba(57,255,20,0.9); }
  }

  .logo {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #39ff14;
    text-shadow: 0 0 8px rgba(57,255,20,0.5);
    margin-bottom: 6px;
  }

  .subtitle {
    color: #999;
    font-size: 14px;
    margin-bottom: 28px;
  }

  .section-title {
    text-align: left;
    color: #39ff14;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  input {
    width: 100%;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid #2a2a2a;
    background: #050505;
    color: #fff;
    font-size: 16px;
    margin-bottom: 20px;
    outline: none;
  }
  input:focus { border-color: #39ff14; }

  button.submit {
    width: 100%;
    padding: 16px;
    border-radius: 10px;
    border: none;
    background: #39ff14;
    color: #000;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
  }
  button.submit:hover { background: #2fd90f; }
  button.submit:disabled { background: #333; color: #777; cursor: not-allowed; }

  .result { margin-top: 24px; display: none; }
  .code-box {
    background: #050505;
    border: 2px dashed #39ff14;
    border-radius: 10px;
    padding: 20px;
    font-size: 32px;
    letter-spacing: 5px;
    font-weight: 800;
    color: #39ff14;
    margin-bottom: 16px;
    animation: blink 1.2s infinite;
  }

  @keyframes blink {
    0%, 100% { box-shadow: 0 0 6px rgba(57,255,20,0.5); }
    50% { box-shadow: 0 0 14px rgba(57,255,20,1); }
  }

  .steps {
    text-align: left;
    color: #ccc;
    font-size: 14px;
    line-height: 1.7;
  }

  .error {
    color: #ff5555;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  .footer {
    margin-top: 26px;
    font-size: 11px;
    color: #555;
  }
</style>
</head>
<body>

<!-- Son d'ambiance (démarre coupé, l'utilisateur doit cliquer pour l'activer) -->
<audio id="ambientSound" src="https://files.catbox.moe/zf8z97.opus" loop preload="none"></audio>

<button class="mode-toggle" id="modeToggle" title="Basculer le mode">🌙</button>
<button class="sound-toggle" id="soundToggle" title="Activer/couper le son">🔇</button>

<div class="card">
  <div class="cat-eyes">
    <div class="cat-eye"><div class="cat-pupil"></div></div>
    <div class="cat-eye"><div class="cat-pupil"></div></div>
  </div>

  <img class="avatar" src="https://files.catbox.moe/3cvx9z.jpg" alt="Chat Noir">
  <div class="logo">CHAT NOIR-MD</div>
  <div class="subtitle">Génère ton code de pairing WhatsApp</div>

  <div class="section-title">📱 Numéro WhatsApp</div>
  <input type="text" id="phoneInput" placeholder="Ex: 221776227173">

  <button class="submit" id="submitBtn" onclick="generateCode()">Générer le code</button>

  <div class="error" id="errorBox"></div>

  <div class="result" id="resultBox">
    <div class="code-box" id="codeText">------</div>
    <div class="steps">
      1. WhatsApp > <b>Paramètres</b><br>
      2. <b>Appareils connectés</b> > <b>Connecter un appareil</b><br>
      3. <b>Connecter avec un numéro</b><br>
      4. Entre le code ci-dessus
    </div>
  </div>

  <div class="footer">🖤 Créé par DEV MICHAEL SCOFIELD</div>
</div>

<script>
  const API_URL = "/api/pair";

  // ---------- Mode sombre/nuit ----------
  const modeToggle = document.getElementById("modeToggle");
  let isLightMode = false;
  modeToggle.addEventListener("click", () => {
    isLightMode = !isLightMode;
    document.body.classList.toggle("light-mode", isLightMode);
    modeToggle.textContent = isLightMode ? "☀️" : "🌙";
  });

  // ---------- Bouton son ----------
  const soundToggle = document.getElementById("soundToggle");
  const ambientSound = document.getElementById("ambientSound");
  let soundOn = false;
  soundToggle.addEventListener("click", () => {
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? "🔊" : "🔇";
    if (soundOn) {
      ambientSound.play().catch(() => {
        // Certains navigateurs bloquent l'audio auto — on ignore l'erreur silencieusement
      });
    } else {
      ambientSound.pause();
    }
  });

  // ---------- Génération du code de pairing ----------
  async function generateCode() {
    const phone = document.getElementById("phoneInput").value.replace(/[^0-9]/g, "");
    const errorBox = document.getElementById("errorBox");
    const resultBox = document.getElementById("resultBox");
    const submitBtn = document.getElementById("submitBtn");

    errorBox.style.display = "none";
    resultBox.style.display = "none";

    if (!phone || phone.length < 8) {
      errorBox.textContent = "⚠️ Entre un numéro WhatsApp valide.";
      errorBox.style.display = "block";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Génération...";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ number: phone })
      });
      const data = await res.json();

      if (data.success && data.code) {
        document.getElementById("codeText").textContent = data.code;
        resultBox.style.display = "block";
      } else {
        errorBox.textContent = data.message || "❌ Erreur lors de la génération du code.";
        errorBox.style.display = "block";
      }
    } catch (err) {
      errorBox.textContent = "❌ Impossible de contacter le serveur.";
      errorBox.style.display = "block";
    }

    submitBtn.disabled = false;
    submitBtn.textContent = "Générer le code";
  }
</script>

</body>
</html>
