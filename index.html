<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Noir Crash | Pairing</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, #1a1a1a 0%, #000 75%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    transition: background 0.4s ease;
  }

  body.light-mode {
    background: radial-gradient(circle at top, #2a2a2a 0%, #050505 75%);
  }

  .mode-toggle, .sound-toggle {
    position: fixed;
    z-index: 5;
    background: rgba(20,20,20,0.85);
    border: 1px solid #333;
    color: #e5e5e5;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(255,255,255,0.08);
    transition: 0.2s;
  }
  .mode-toggle { top: 16px; right: 16px; }
  .sound-toggle { bottom: 16px; right: 16px; }
  .mode-toggle:hover, .sound-toggle:hover { box-shadow: 0 0 14px rgba(255,255,255,0.2); }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(15,15,15,0.9);
    backdrop-filter: blur(6px);
    border: 1px solid #262626;
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    text-align: center;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #e5e5e5;
    margin-bottom: 16px;
  }

  .logo {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #fff;
    margin-bottom: 6px;
  }

  .subtitle {
    color: #9a9a9a;
    font-size: 14px;
    font-weight: 400;
    margin-bottom: 28px;
  }

  .section-title {
    text-align: left;
    color: #cfcfcf;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }

  input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #2c2c2c;
    background: #0d0d0d;
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    margin-bottom: 20px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #888; }

  button.submit {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: #fff;
    color: #000;
    font-weight: 700;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
  }
  button.submit:hover { background: #d9d9d9; }
  button.submit:disabled { background: #2a2a2a; color: #777; cursor: not-allowed; }

  .result { margin-top: 22px; display: none; }
  .code-box {
    background: #0d0d0d;
    border: 2px dashed #555;
    border-radius: 12px;
    padding: 18px;
    font-size: 28px;
    letter-spacing: 4px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 14px;
  }

  .steps {
    text-align: left;
    color: #b5b5b5;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.7;
  }

  .error {
    color: #ff6b6b;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  .footer {
    margin-top: 24px;
    font-size: 11px;
    color: #555;
    font-weight: 400;
  }
</style>
</head>
<body>

<audio id="ambientSound" src="https://files.catbox.moe/zf8z97.opus" loop preload="none"></audio>

<button class="mode-toggle" id="modeToggle" title="Basculer le mode">🌙</button>
<button class="sound-toggle" id="soundToggle" title="Activer/couper le son">🔇</button>

<div class="card">
  <img class="avatar" src="https://files.catbox.moe/3cvx9z.jpg" alt="Chat Noir Crash">
  <div class="logo">Chat Noir Crash</div>
  <div class="subtitle">Génère ton code de pairing WhatsApp</div>

  <div class="section-title">Numéro WhatsApp</div>
  <input type="text" id="phoneInput" placeholder="Ex: 221776227173">

  <button class="submit" id="submitBtn" onclick="generateCode()">Générer le code</button>

  <div class="error" id="errorBox"></div>

  <div class="result" id="resultBox">
    <div class="code-box" id="codeText">------</div>
    <div class="steps">
      1. WhatsApp > <b>Paramètres</b><br>
      2. <b>Appareils connectés</b> > <b>Connecter un appareil</b><br>
      3. <b>Connecter avec un numéro</b><br>
      4. Entre le code ci-dessus
    </div>
  </div>

  <div class="footer">Créé par DEV MICHAEL SCOFIELD</div>
</div>

<script>
  const API_URL = "http://51.83.6.7:20185/api/pair";

  const modeToggle = document.getElementById("modeToggle");
  let isLightMode = false;
  modeToggle.addEventListener("click", () => {
    isLightMode = !isLightMode;
    document.body.classList.toggle("light-mode", isLightMode);
    modeToggle.textContent = isLightMode ? "☀️" : "🌙";
  });

  const soundToggle = document.getElementById("soundToggle");
  const ambientSound = document.getElementById("ambientSound");
  let soundOn = false;
  soundToggle.addEventListener("click", () => {
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? "🔊" : "🔇";
    if (soundOn) {
      ambientSound.play().catch(() => {});
    } else {
      ambientSound.pause();
    }
  });

  async function generateCode() {
    const phone = document.getElementById("phoneInput").value.replace(/[^0-9]/g, "");
    const errorBox = document.getElementById("errorBox");
    const resultBox = document.getElementById("resultBox");
    const submitBtn = document.getElementById("submitBtn");

    errorBox.style.display = "none";
    resultBox.style.display = "none";

    if (!phone || phone.length < 8) {
      errorBox.textContent = "⚠️ Entre un numéro WhatsApp valide.";
      errorBox.style.display = "block";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Génération...";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ number: phone })
      });
      const data = await res.json();

      if (data.success && data.code) {
        document.getElementById("codeText").textContent = data.code;
        resultBox.style.display = "block";
      } else {
        errorBox.textContent = data.message || "❌ Erreur lors de la génération du code.";
        errorBox.style.display = "block";
      }
    } catch (err) {
      errorBox.textContent = "❌ Impossible de contacter le serveur.";
      errorBox.style.display = "block";
    }

    submitBtn.disabled = false;
    submitBtn.textContent = "Générer le code";
  }
</script>

</body>
</html>
